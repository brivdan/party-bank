{% extends "base.html" %}
{% block title %}Change password · {{ settings.party_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password
      <input name="current" type="password" required autocomplete="current-password">
    </label>
    <label>New password (at least {{ min_length }} characters)
      <input name="new" type="password" required minlength="{{ min_length }}" autocomplete="new-password">
    </label>
    <label>Repeat new password
      <input name="repeat" type="password" required minlength="{{ min_length }}" autocomplete="new-password">
    </label>
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}
