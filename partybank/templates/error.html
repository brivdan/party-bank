{% extends "base.html" %}
{% block title %}Error {{ code }} · {{ settings.party_name }}{% endblock %}
{% block content %}
<section class="card narrow center">
  <h1>{{ {400: 'Bad request', 403: 'Access denied', 404: 'Not found'}.get(code, 'Error') }}</h1>
  <p>{{ message }}</p>
  <p><a href="{{ url_for('index') }}">Go to start page</a></p>
</section>
{% endblock %}
