{% extends "base.html" %}
{% block title %}Admin login · {{ settings.party_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Bank staff login</h1>
  <form method="post" action="{{ url_for('auth.admin_login', next=request.args.get('next')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" value="{{ username }}" required autocapitalize="none" autofocus>
    </label>
    <label>Password
      <input name="password" type="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted small center"><a href="{{ url_for('auth.login') }}">Card login</a></p>
</section>
{% endblock %}
